name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DIRT version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 26.1, Apple M3"
    validations:
      required: true
  - type: dropdown
    id: fda
    attributes:
      label: Does DIRT have Full Disk Access?
      options: ["Yes", "No", "Not sure"]
  - type: markdown
    attributes:
      value: Please don't paste API keys or anything you wouldn't want public. For security issues, see SECURITY.md instead.
